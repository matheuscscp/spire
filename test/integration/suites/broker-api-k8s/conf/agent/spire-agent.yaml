# ServiceAccount for the SPIRE agent
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-agent
  namespace: spire

---
# Cluster role granting the agent permission to:
#  - read pods/nodes for the legacy PID/k8s_psat path
#  - read Kustomization CRs so the broker API can attest non-pod object references
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: spire-agent-cluster-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "nodes/proxy"]
    verbs: ["get", "list"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "list"]

---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: spire-agent-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: spire-agent
    namespace: spire
roleRef:
  kind: ClusterRole
  name: spire-agent-cluster-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent
  namespace: spire
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "DEBUG"
      server_address = "spire-server"
      server_port = "8081"
      socket_path = "/run/spire/agent-sockets/api.sock"
      trust_bundle_path = "/run/spire/bundle/bundle.crt"
      trust_domain = "example.org"

      experimental {
        # Enable the SPIFFE Broker API endpoint on both a UDS (for local
        # brokers) and a TCP listener (for remote brokers). The TCP port
        # is fronted by the spire-broker Service. Each authorized broker
        # presents a SPIFFE ID; mTLS at the listener gates the set.
        broker {
          socket_path  = "/run/spire/broker-sockets/broker.sock"
          bind_address = "0.0.0.0:8443"
          # Fail-closed for TCP except KubernetesObjectReference (so the
          # TCP test in this suite succeeds while PID-over-TCP is denied).
          allowed_reference_types_over_tcp = [
            "type.googleapis.com/spiffe.broker.KubernetesObjectReference",
          ]
          brokers = [
            {
              id = "spiffe://example.org/broker"
              allowed_reference_types = ["*"]
            },
            {
              id = "spiffe://example.org/restricted-broker"
              allowed_reference_types = [
                "type.googleapis.com/spiffe.broker.WorkloadPIDReference",
              ]
            },
          ]
        }
      }
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "example-cluster"
        }
      }

      KeyManager "memory" {
        plugin_data {
        }
      }

      WorkloadAttestor "k8s" {
        plugin_data {
          # Skip kubelet cert verification (kind doesn't ship a CA bundle entry for it).
          skip_kubelet_verification = true

          api_server_cache {
            enabled = true
          }
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      namespace: spire
      labels:
        app: spire-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spire-agent
      containers:
        - name: spire-agent
          image: spire-agent:latest-local
          imagePullPolicy: Never
          args: ["-config", "/run/spire/config/agent.conf"]
          ports:
            - name: broker
              containerPort: 8443
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: false
            - name: spire-broker-socket
              mountPath: /run/spire/broker-sockets
              readOnly: false
            - name: spire-token
              mountPath: /var/run/secrets/tokens
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: spire-config
          configMap:
            name: spire-agent
        - name: spire-bundle
          configMap:
            name: spire-bundle
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: DirectoryOrCreate
        - name: spire-broker-socket
          hostPath:
            path: /run/spire/broker-sockets
            type: DirectoryOrCreate
        - name: spire-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server

---
# Fronts the agent's broker TCP listener so remote-style brokers can reach
# it without depending on hostNetwork or the node IP. Targets the daemonset
# pods directly via the `app=spire-agent` selector.
apiVersion: v1
kind: Service
metadata:
  name: spire-broker
  namespace: spire
spec:
  type: ClusterIP
  selector:
    app: spire-agent
  ports:
    - name: broker
      port: 8443
      targetPort: 8443
      protocol: TCP
